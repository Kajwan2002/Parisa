name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # hers → https://<user>.github.io/<repo>/   (Parisa · pink)
      - name: Build Parisa
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # his → https://<user>.github.io/<repo>/mine/   (The Treasury · dark)
      - name: Build The Treasury
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/mine/
          VITE_VARIANT: treasury
          VITE_OUT_DIR: dist/mine

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
